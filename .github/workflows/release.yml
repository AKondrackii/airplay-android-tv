name: Release

# Push a tag like v1.2.0 to publish a signed release:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $TAG)"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. See docs/DEVELOPMENT.md → «Релизы на GitHub»."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore/keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APKs
        run: >
          ./gradlew :app:assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify signatures and collect files
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p dist
          for abi in universal armeabi-v7a arm64-v8a x86 x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            "$APKSIGNER" verify "$src"
            cp "$src" "dist/AirPlayReceiver-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          rm -f keystore/release.jks keystore/keystore.properties

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AirPlay Receiver ${{ steps.version.outputs.name }}
          generate_release_notes: true
          body: |
            ## Какой файл скачать
            | Устройство | Файл |
            |---|---|
            | Не знаю / сомневаюсь | **AirPlayReceiver-universal.apk** |
            | Большинство ТВ-приставок и телевизоров | AirPlayReceiver-armeabi-v7a.apk |
            | NVIDIA Shield, Chromecast with Google TV, новые ТВ | AirPlayReceiver-arm64-v8a.apk |

            Инструкция по установке: [README](https://github.com/${{ github.repository }}#-как-установить).
            Контрольные суммы: `SHA256SUMS.txt`.
          files: dist/*
